# Standalone test stack: no developer env file, bind mounts, or production volumes.
x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://reportapi:reportapi@postgres:5432/reportapi
    REDIS_URL: redis://redis:6379/0
    APP_ENV: production
    JIRA_ALLOWED_ORIGINS: http://upstream:8090
    OLLAMA_ALLOWED_ORIGINS: http://upstream:8090
    OUTBOUND_PRIVATE_ORIGINS: http://upstream:8090
    CONFIG_API_TOKEN: smoke-test-token
    CONFIG_STORE_PATH: /config/runtime.env
    JIRA_URL: http://upstream:8090
    JIRA_EMAIL: test@example.com
    JIRA_API_TOKEN: synthetic
    LLM_PROVIDER: openai
    OLLAMA_BASE_URL: http://upstream:8090
  volumes:
    - ci_config:/config
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    upstream:
      condition: service_started
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: reportapi
      POSTGRES_PASSWORD: reportapi
      POSTGRES_DB: reportapi
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reportapi']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  upstream:
    image: python:3.12-slim@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    command: python /mock/upstream.py
    volumes:
      - ./scripts/smoke_upstream.py:/mock/upstream.py:ro
  api:
    <<: *app
    ports: ['127.0.0.1:18000:8000']
  worker:
    <<: *app
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1
  beat:
    <<: *app
    command: celery -A app.worker.celery_app beat --loglevel=info
  config-ui:
    build: ./config-ui
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ['127.0.0.1:18080:8080']
    depends_on: [api]
volumes:
  ci_config:
