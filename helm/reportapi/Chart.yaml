apiVersion: v2
name: reportapi
description: Container-native reporting engine for Agile ticket data — Jira/Asana/GitHub connectors, pluggable LLM, PII stripping.
type: application
version: 0.6.1
appVersion: "0.5.2"
home: https://github.com/utkarshmankad/reportapi-selfhosted
sources:
  - https://github.com/utkarshmankad/reportapi-selfhosted
keywords:
  - reporting
  - jira
  - llm
  - self-hosted
maintainers:
  - name: utkarshmankad
dependencies:
  - name: postgresql
    version: "16.7.27"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: postgresql.enabled
  - name: redis
    version: "21.2.13"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: redis.enabled
