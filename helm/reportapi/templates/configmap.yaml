apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reportapi.fullname" . }}-config
  labels:
    {{- include "reportapi.labels" . | nindent 4 }}
data:
  {{- range $key, $value := omit .Values.env "DATABASE_URL" "REDIS_URL" "CONFIG_STORE_PATH" "CONFIG_READ_ONLY" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  CONFIG_STORE_PATH: "/config/runtime.env"
  CONFIG_READ_ONLY: {{ ternary "false" "true" .Values.runtimeConfig.persistence.enabled | quote }}
