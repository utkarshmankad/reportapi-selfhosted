apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "reportapi.fullname" . }}-config
  labels:
    {{- include "reportapi.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
  REDIS_URL: "redis://{{ .Release.Name }}-redis-master:6379/0"
