apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reportapi.fullname" . }}-worker
  labels:
    {{- include "reportapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "reportapi.labels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "reportapi.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: {{ include "reportapi.fullname" . }}-config
            - secretRef:
                name: {{ include "reportapi.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
{{- if .Values.beat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reportapi.fullname" . }}-beat
  labels:
    {{- include "reportapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "reportapi.labels" . | nindent 6 }}
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        {{- include "reportapi.labels" . | nindent 8 }}
        app.kubernetes.io/component: beat
    spec:
      containers:
        - name: beat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: {{ include "reportapi.fullname" . }}-config
            - secretRef:
                name: {{ include "reportapi.fullname" . }}-secrets
{{- end }}
