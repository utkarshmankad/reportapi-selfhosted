name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_NO_INTERACTION: '1'
  DATABASE_URL: postgresql+asyncpg://reportapi:reportapi@localhost:5432/reportapi
  REDIS_URL: redis://localhost:6379/0

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: poetry check --lock
      - run: poetry run ruff check app tests scripts alembic
      - run: poetry run ruff format --check app tests scripts alembic
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: config-ui/package-lock.json
      - run: npm ci
        working-directory: config-ui
      - run: poetry run python scripts/export_openapi.py
      - run: npm run generate:types
        working-directory: config-ui
      - name: Fail if generated API types are out of date
        run: |
          if ! git diff --quiet -- config-ui/openapi.json config-ui/lib/api-types.generated.ts; then
            echo "config-ui/lib/api-types.generated.ts is out of date."
            echo "Run: poetry run python scripts/export_openapi.py && (cd config-ui && npm run generate:types)"
            git diff -- config-ui/openapi.json config-ui/lib/api-types.generated.ts
            exit 1
          fi
      - run: npm run typecheck && npm run lint && npm run format:check && npm run build
        working-directory: config-ui

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: poetry run pytest tests --ignore=tests/integration -m 'not integration and not e2e' --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  frontend-tests:
    name: Frontend tests and 80% coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: config-ui/package-lock.json
      - run: npm ci && npm run test:coverage
        working-directory: config-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: config-ui/coverage
          if-no-files-found: error

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reportapi
          POSTGRES_PASSWORD: reportapi
          POSTGRES_DB: reportapi
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U reportapi"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: poetry run alembic upgrade head
      - run: poetry run alembic check
      - run: poetry run pytest tests/integration -v -m integration

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python
      - run: poetry run bandit -r app -ll
      # Runs inside the installed project environment, and fails on findings.
      - run: poetry run pip-audit --progress-spinner=off
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: config-ui/package-lock.json
      - run: npm ci && npm audit --audit-level=moderate
        working-directory: config-ui

  smoke:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: config-ui/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: config-ui
      - run: ./scripts/e2e-smoke.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: config-ui/test-results

  helm-smoke:
    name: Helm chart (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: ./scripts/helm-smoke.sh

  ci:
    name: CI required
    if: always()
    needs: [quality, unit-tests, frontend-tests, integration-tests, security, smoke, helm-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every gate to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required gates did not pass: ' + ', '.join(failed))
          PY

  publish:
    name: Publish images to GHCR
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reportapi-engine:latest
            ghcr.io/${{ github.repository_owner }}/reportapi-engine:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./config-ui
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reportapi-config-ui:latest
            ghcr.io/${{ github.repository_owner }}/reportapi-config-ui:${{ github.sha }}
